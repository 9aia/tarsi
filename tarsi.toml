# tarsi's own release config — dogfoods the pipeline.
# Units resolve from the cargo workspace (crates/*); versions are
# workspace-inherited, so releasing units share one bump — keep
# overrides minimal until per-unit workspace versions are supported.

[release]
styleguide = "keep-a-changelog"
changelog_path = "CHANGELOG.md"
diff_exclude = ["docs/**", "project/**", "*.md", ".github/**"]

[release.unit_overrides.tarsi-xtask]
skip = true

[publish.crates]
enabled = false   # not on crates.io yet

[publish.ghreleases]
enabled = false  # org doesn't use GH releases — capability stays for external consumers
# token_env = "GITHUB_TOKEN"
# repo defaults to the origin remote (9aia/tarsi)
# Release assets: repo-root-relative globs; {unit}/{version} expand
# per unit. Uncomment once dist/ artifacts exist:
# assets = ["dist/{unit}-{version}-*"]
