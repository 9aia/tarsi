[package]
name = "tarsi-testkit"
description = "Conformance fixtures + golden corpus for tarsi ports/impls."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
tempfile = "3"
tarsi-core = { path = "../tarsi-core" }
tarsi-serve = { path = "../tarsi-serve" }
lasius-vcs = { git = "ssh://git@github.com/9aia/lasius.git", rev = "89e51894b9cd118141fe66d1c8c1d114c60d4ea5" }

[dev-dependencies]
lasius-vcs-git = { git = "ssh://git@github.com/9aia/lasius.git", rev = "89e51894b9cd118141fe66d1c8c1d114c60d4ea5" }

[lints]
workspace = true
