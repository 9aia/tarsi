[package]
name = "tarsi-serve"
description = "tarsi service surface — ndjson ops (plan/changelog/notes/check/schema + granular bump/tag/publish + release) over tarsi-core + lasius-vcs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tarsi-serve"
path = "src/main.rs"

[dependencies]
tarsi-core = { path = "../tarsi-core" }
tarsi-config = { path = "../tarsi-config" }
tarsi-manifest = { path = "../tarsi-manifest" }
tarsi-publish = { path = "../tarsi-publish" }
tarsi-publish-crates = { path = "../tarsi-publish-crates" }
tarsi-publish-ghreleases = { path = "../tarsi-publish-ghreleases" }
tarsi-publish-dryrun = { path = "../tarsi-publish-dryrun" }
lasius-vcs = { git = "ssh://git@github.com/9aia/lasius.git", rev = "622eae462da7a6fd31e94333a3c44aea81c4df49" }
lasius-vcs-git = { git = "ssh://git@github.com/9aia/lasius.git", rev = "622eae462da7a6fd31e94333a3c44aea81c4df49" }
hypha-serve-cli = { git = "https://github.com/9aia/hypha.git", rev = "5aac70b91436787783b6de9602badd7f687597bc" }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
glob = "0.3"
regex = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
