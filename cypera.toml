# tarsi — docs/reference generation contract for `cypera`
# (`cypera gen crate-map|config`, discovered upward from --repo).
# Replaces the retired docs/gen-*.py wrappers; schema lives in
# ../cypera crates/cypera-core/src/repo_config.rs. There is no `tarsi`
# CLI — config + crate-map only.

[crate_map]

[crate_map.layers]
"tarsi-core" = "domain"
"tarsi-publish" = "port"
"tarsi-config" = "adapter"
"tarsi-manifest" = "adapter"
"tarsi-publish-crates" = "adapter"
"tarsi-publish-dryrun" = "adapter"
"tarsi-publish-ghreleases" = "adapter"
"tarsi-serve" = "engine"
"tarsi-driver" = "driver"
"tarsi-testkit" = "testkit"
"tarsi-xtask" = "tooling"

[[crate_map.splices]]
target = "docs/reference/crates.md"
marker = "<!-- crate-map -->"

[config]
title = "tarsi.toml schema"
types = { "String" = "string", "bool" = "bool", "u32" = "int", "usize" = "int", "Vec<String>" = "list", "PathBuf" = "path" }
table_head = "| key | type | required | meaning |"
table_sep = "| --- | --- | --- | --- |"
marker = """
<!-- generated by cypera gen config — field tables come from the
     config structs; prose sections are curated in cypera.toml -->
"""
preamble = """
The config document is `tarsi_core::Config` — TOML or YAML
(`tarsi.yaml`/`tarsi.yml` preferred on discovery ties). Pure serde
types in `crates/tarsi-core/src/config.rs`; loading/layering in
`tarsi-config`. Secret **names** appear (`token_env`); values never
do.
"""
out = "docs/reference/config.md"

